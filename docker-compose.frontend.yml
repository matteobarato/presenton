name: slideshows-frontend
services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: ["${SLIDESHOWS_FRONTEND_PORT:-5173}:5173"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - BACKEND_URL=${SLIDESHOWS_BACKEND_URL:-http://host.docker.internal:5001}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - slideshows_frontend_node_modules:/app/node_modules
volumes:
  slideshows_frontend_node_modules:
