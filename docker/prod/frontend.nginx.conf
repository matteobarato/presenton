server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vue Router history mode: unknown paths load the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
