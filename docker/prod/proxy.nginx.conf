# Reverse proxy for docker-compose.prod.yml. Derived from ../../nginx.conf.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types; # Required for SVG mime type
  default_type application/octet-stream; # Required for SVG mime type
  access_log /var/log/nginx/access.log;
  client_max_body_size 100M;

  # Docker's DNS; `resolve` below follows containers that get a new address.
  resolver 127.0.0.11 valid=10s;
  upstream api_up      { zone api_up 64k;      server api:8000 resolve; }
  upstream mcp_up      { zone mcp_up 64k;      server api:8001 resolve; }
  upstream renderer_up { zone renderer_up 64k; server renderer:3000 resolve; }
  upstream frontend_up { zone frontend_up 64k; server frontend:80 resolve; }

  # Keep the browser-facing origin supplied by an outer reverse proxy. Direct
  # deployments fall back to this nginx listener's own scheme and Host header.
  map $http_x_forwarded_proto $presenton_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
  }
  map $http_x_forwarded_host $presenton_forwarded_host {
    "" $http_host;
    default $http_x_forwarded_host;
  }

  # Inherited by every location that sets no proxy_set_header of its own.
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
  proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
  proxy_read_timeout 30m;
  proxy_send_timeout 30m;
  proxy_connect_timeout 30m;

  # Users.
  server {
    listen 80;
    server_name _;

    include /etc/nginx/presenton/locations.conf;

    # Routes the Vue app calls that Next.js still serves.
    location = /api/runtime-config { proxy_pass http://renderer_up; }
    location = /api/templates { proxy_pass http://renderer_up; }
    location = /api/has-required-key { proxy_pass http://renderer_up; }
    location = /api/can-change-keys { proxy_pass http://renderer_up; }
    location = /api/update-svg { proxy_pass http://renderer_up; }

    # MCP
    location /mcp/ {
      client_max_body_size 145M;
      # FastMCP validates the Presenton bearer key itself. Do not use the
      # app-data auth subrequest here.
      proxy_pass http://mcp_up/mcp/;
      # FastMCP validates this internal Host against its strict allowlist.
      # X-Forwarded-Host preserves the browser-reachable public host.
      proxy_set_header Host localhost:8001;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
      proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
    }

    location /mcp {
      client_max_body_size 145M;
      proxy_pass http://mcp_up/mcp;
      proxy_set_header Host localhost:8001;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
      proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
    }

    location /docs {
      proxy_pass http://api_up/docs;
    }

    location /openapi.json {
      proxy_pass http://api_up/openapi.json;
    }

    location / {
      proxy_pass http://frontend_up;
    }
  }

  # Containers only (never published): the API service loads the export page,
  # video composition and template routes through here, on a single origin.
  server {
    listen 8080;
    server_name _;

    include /etc/nginx/presenton/locations.conf;

    location / {
      proxy_pass http://renderer_up;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $presenton_forwarded_proto;
      proxy_set_header X-Forwarded-Host $presenton_forwarded_host;
    }
  }
}
