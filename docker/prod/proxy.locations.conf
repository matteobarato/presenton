# Locations shared by the public and container-only servers.

location /api/v1/ {
  client_max_body_size 110M;
  error_page 413 = @request_entity_too_large;
  proxy_pass http://api_up;
}

location /api/v2/ {
  proxy_pass http://api_up;
}

location @request_entity_too_large {
  default_type application/json;
  return 413 '{"detail":"File size must be less than 100MB."}';
}

# Bundled UI assets; they contain no user data.
location /static/ {
  proxy_pass http://api_up;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# Internal auth subrequest that keeps /app_data/* files private.
location = /_auth_check {
  internal;
  proxy_pass http://api_up/api/v1/auth/verify;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header Host $host;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
}

location /app_data/images/ {
  auth_request /_auth_check;
  alias /app_data/images/;
  disable_symlinks on;
  expires 1y;
  add_header Cache-Control "private, max-age=31536000";
}

