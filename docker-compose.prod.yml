  AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
  AUTH_OVERRIDE_FROM_ENV: "${AUTH_OVERRIDE_FROM_ENV:-}"
  RESET_AUTH: "${RESET_AUTH:-}"

services:
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PRESENTON_HTTP_HOST_PORT}:80"
    volumes:
      - ./docker/prod/proxy.nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/prod/proxy.locations.conf:/etc/nginx/presenton/locations.conf:ro
      - ${PRESENTON_APP_DATA_PATH:-app_data}:/app_data:ro
    depends_on:
      - api
      - renderer
      - frontend

  frontend:
    build:
      context: .
      dockerfile: docker/prod/frontend.Dockerfile
    restart: unless-stopped

  api:
    platform: ${PRESENTON_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/prod/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      # Web routes are reached through the proxy's container-only listener.
      NEXT_PUBLIC_URL: http://proxy:8080
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ${PRESENTON_APP_DATA_PATH:-app_data}:/app_data
      - ./secrets:/secrets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/auth/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  renderer:
    build:
      context: .
      dockerfile: docker/prod/renderer.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      FAST_API_INTERNAL_URL: http://api:8000
      APP_DATA_DIRECTORY: /app_data
      USER_CONFIG_PATH: /app_data/userConfig.json
      TEMP_DIRECTORY: /tmp/presenton
    volumes:
      - ${PRESENTON_APP_DATA_PATH:-app_data}:/app_data
    depends_on:
      api:
        condition: service_healthy

volumes:
  app_data:
