  OPEN_WEBUI_IMAGE_API_KEY: "${OPEN_WEBUI_IMAGE_API_KEY:-}"
  OPENAI_COMPAT_IMAGE_BASE_URL: "${OPENAI_COMPAT_IMAGE_BASE_URL:-}"
  OPENAI_COMPAT_IMAGE_API_KEY: "${OPENAI_COMPAT_IMAGE_API_KEY:-}"
  OPENAI_COMPAT_IMAGE_MODEL: "${OPENAI_COMPAT_IMAGE_MODEL:-}"
  OPENAI_COMPAT_IMAGE_TRANSPORT: "${OPENAI_COMPAT_IMAGE_TRANSPORT:-}"
  OPENAI_COMPAT_TTS_BASE_URL: "${OPENAI_COMPAT_TTS_BASE_URL:-}"
  OPENAI_COMPAT_TTS_API_KEY: "${OPENAI_COMPAT_TTS_API_KEY:-}"
  HEYGEN_LIPSYNC_CONCURRENCY: "${HEYGEN_LIPSYNC_CONCURRENCY:-}"
  OPENAI_COMPAT_TTS_MODEL: "${OPENAI_COMPAT_TTS_MODEL:-}"
  OPENAI_COMPAT_TTS_VOICE: "${OPENAI_COMPAT_TTS_VOICE:-}"
  OPENAI_COMPAT_TTS_TRANSPORT: "${OPENAI_COMPAT_TTS_TRANSPORT:-}"
  OPENAI_COMPAT_TTS_INSTRUCTION: "${OPENAI_COMPAT_TTS_INSTRUCTION:-}"
  VERTEX_COMPAT_TTS_PROJECT: "${VERTEX_COMPAT_TTS_PROJECT:-}"
  VERTEX_COMPAT_TTS_LOCATION: "${VERTEX_COMPAT_TTS_LOCATION:-}"
  VERTEX_COMPAT_TTS_BASE_URL: "${VERTEX_COMPAT_TTS_BASE_URL:-}"
  VERTEX_COMPAT_TTS_API_KEY: "${VERTEX_COMPAT_TTS_API_KEY:-}"
  VERTEX_COMPAT_TTS_MODEL: "${VERTEX_COMPAT_TTS_MODEL:-}"
  VERTEX_COMPAT_TTS_VOICE: "${VERTEX_COMPAT_TTS_VOICE:-}"
  OPENROUTER_TTS_BASE_URL: "${OPENROUTER_TTS_BASE_URL:-}"
  OPENROUTER_TTS_API_KEY: "${OPENROUTER_TTS_API_KEY:-}"
  OPENROUTER_TTS_MODEL: "${OPENROUTER_TTS_MODEL:-}"
  OPENROUTER_TTS_VOICE: "${OPENROUTER_TTS_VOICE:-}"
  OPENROUTER_TTS_FORMAT: "${OPENROUTER_TTS_FORMAT:-}"
  GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
  FFMPEG_BINARY: "${FFMPEG_BINARY:-}"
  FFPROBE_BINARY: "${FFPROBE_BINARY:-}"
  PRESENTATION_VIDEO_ENCODE_CONCURRENCY: "${PRESENTATION_VIDEO_ENCODE_CONCURRENCY:-}"
  PDF_TO_IMAGES_MAX_RENDER_SCALE: "${PDF_TO_IMAGES_MAX_RENDER_SCALE:-}"
  PRESENTATION_VIDEO_ANIMATION_WORKERS: "${PRESENTATION_VIDEO_ANIMATION_WORKERS:-}"
  PRESENTATION_VIDEO_ANIMATION_TIMEOUT_SECONDS: "${PRESENTATION_VIDEO_ANIMATION_TIMEOUT_SECONDS:-}"
