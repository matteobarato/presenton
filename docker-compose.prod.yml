# Production: Vue frontend behind its own nginx. Next.js only runs as a hidden
# renderer for export, video and templates.
#   docker compose -f docker-compose.prod.yml up -d --build
# Data lives in the named volume `app_data`, which survives redeploys and
# re-clones. Set PRESENTON_APP_DATA_PATH to an absolute host path to use a
# folder instead.
name: presenton-prod

# Shared by `api` and `renderer`.
x-app-env: &app-env
  PRESENTON_HOST_HTTP_PORT: "${PRESENTON_HOST_HTTP_PORT:-5001}"
  PRESENTON_PUBLIC_URL: "${PRESENTON_PUBLIC_URL:-}"
  MIGRATE_DATABASE_ON_STARTUP: "true"
  CAN_CHANGE_KEYS: "${CAN_CHANGE_KEYS:-}"
  PRESENTATION_GENERATION_MODE: "${PRESENTATION_GENERATION_MODE:-both}"
  PRESENTON_COMMUNITY_ENABLED: "${PRESENTON_COMMUNITY_ENABLED:-true}"
  LLM: "${LLM:-}"
  LLM_RATE_LIMIT_MAX_ATTEMPTS: "${LLM_RATE_LIMIT_MAX_ATTEMPTS:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-}"
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
  DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-}"
  DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
